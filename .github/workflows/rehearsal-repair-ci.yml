name: Synthetic repair CI
on:
  pull_request:
    branches: [rin-release-rehearsal-base]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  exact-head:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'rin-release-rehearsal-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Test exact candidate
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          python3 -m unittest discover -s tests -p test_repaired_stock.py
