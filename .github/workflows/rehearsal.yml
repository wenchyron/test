name: Synthetic release rehearsal
on:
  push:
    branches: ['rin-release-rehearsal/**']
permissions:
  contents: read
concurrency:
  group: rin-release-rehearsal-synthetic-cabinet
  queue: max
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run exact synthetic scenario
        run: python3 tests/hosted_rehearsal.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
          retention-days: 14
